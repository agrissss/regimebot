name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Actions are pinned by full commit SHA (the release tag in the comment); Dependabot updates them.
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            unlocked: "^$" # every version as locked
          # numpy 2.5 and contourpy 1.4 have no Python 3.11 release: that leg takes the newest
          # ones that support it; every other version is the lock's
          - python-version: "3.11"
            unlocked: "^(numpy|contourpy)=="
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # the lock as constraints: CI tests the versions that ship
      - run: grep -vE '${{ matrix.unlocked }}' requirements.lock > "$RUNNER_TEMP/constraints.txt"
      - run: pip install -c "$RUNNER_TEMP/constraints.txt" -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy regimebot
      - run: pytest

  postgres:
    # the database tests (marked `db`) against Postgres 16, as docker-compose runs it
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: regimebot
          POSTGRES_PASSWORD: regimebot
          POSTGRES_DB: regimebot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regimebot -d regimebot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # each test creates and drops its own schema in this database (tests/conftest.py)
      TEST_DATABASE_URL: postgresql+psycopg://regimebot:regimebot@localhost:5432/regimebot_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -c requirements.lock -e ".[dev,postgres]"
      - run: pytest -m db

  docker:
    # the image as shipped (no push): it starts, and migrates its default SQLite database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --build-arg GIT_SHA="$GITHUB_SHA" -t regimebot:ci .
      - run: docker run --rm regimebot:ci version
      - run: docker run --rm regimebot:ci db upgrade
