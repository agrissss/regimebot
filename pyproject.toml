[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "regimebot"
version = "0.1.0"
description = "Regime-aware crypto trading research system (backtest and paper trading)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "ccxt>=4.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "typer>=0.12",
    "structlog>=24.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pandas-stubs", "types-PyYAML"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
regimebot = "regimebot.cli:app"

[tool.setuptools.packages.find]
include = ["regimebot*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "DTZ"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ccxt.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = ["db: runs against TEST_DATABASE_URL when it is set (the CI Postgres job)"]
